<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhijat Patel - GitHub Profile Live Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      max-width: 1200px;
      width: 100%;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #091224;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
    .header h1 { font-size: 20px; font-weight: 700; color: #ffffff; }
    .badge {
      background: #247bff;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      width: 100%;
      background: #070b16;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Abhijat Patel — GitHub Profile Visual Verification</h1>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">Standalone SVG + SMIL animation suite matching GitHub rendering engine</p>
    </div>
    <span class="badge">100% GITHUB SAFE</span>
  </div>

  <div class="container">
    <div class="card">
      <img src="./assets/hero.svg?v=4" alt="Hero Section"/>
    </div>
    <div class="card">
      <img src="./assets/about-life.svg?v=4" alt="About Section"/>
    </div>
    <div class="card">
      <img src="./assets/stack.svg?v=4" alt="Tech Stack Section"/>
    </div>
    <div class="card">
      <img src="./assets/id-dashboard.svg?v=4" alt="ID Dashboard Section"/>
    </div>
    <div class="card">
      <img src="./assets/connect.svg?v=4" alt="Connect Section"/>
    </div>
  </div>
</body>
</html>
